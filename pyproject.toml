[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
authors = [{name = "Matthew D. Webb", email = "matt.webb@carleton.ca"}]
readme = "README.md"
license = "MIT"
name = "fastdid2spy"
version = "0.1.0"
description = "Static two-stage differences in differences with corrected clustered inference"
requires-python = ">=3.10"
dependencies = ["numpy"]
[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
examples = ["pandas>=2"]
test = ["pytest>=7", "scipy", "pandas"]

[project.urls]
Repository = "https://github.com/mattdwebb/fastdid2spy"
Issues = "https://github.com/mattdwebb/fastdid2spy/issues"
